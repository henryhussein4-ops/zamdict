<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0f0d">
<title>ZamDict — Zambia's Living Dictionary</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5.0.13/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5.0.13/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5.0.14/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5.0.14/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5.0.14/800.css">
<style>
:root{--bg:#0a0f0d;--bg2:#0d1411;--card:#121a16;--card2:#17221c;--line:#22302a;--ink:#eaf3ed;--mut:#8fa79a;--dim:#64796e;--acc:#ff8a3d;--acc-ink:#201205;--grn:#3ecf7a;--grn-ink:#062b17;--red:#e5484d;--glow1:rgba(255,138,61,.14);--mark:rgba(255,138,61,.3);--disp:'Space Grotesk',sans-serif;--body:'Manrope',sans-serif;--app-vh:100vh;--app-vtop:0px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;min-height:100vh;user-select:none;-webkit-user-select:none}
input,textarea,select{user-select:text;-webkit-user-select:text}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(600px 320px at 85% -60px,var(--glow1),transparent 70%)}
body.no-scroll{overflow:hidden}
button{font-family:var(--body);color:inherit;background:none;border:none;cursor:pointer}
::selection{background:var(--acc);color:var(--acc-ink)}
mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 2px}
.ic{flex:none;vertical-align:middle}.dim{color:var(--mut)}
.grad{background:linear-gradient(92deg,var(--acc),var(--grn));-webkit-background-clip:text;background-clip:text;color:transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
#app{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:0 14px calc(60px + env(safe-area-inset-bottom));width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 8px;gap:8px}
body.ai-full .topbar,body.ai-full .livebar,body.ai-full footer,body.ai-full #nav,body.ai-full .sticky{display:none}
.logo{display:flex;align-items:center;gap:10px;text-align:left;min-width:0}
.logo svg{width:38px;height:38px;flex:none}
.logo-name{font-family:var(--disp);font-weight:700;font-size:20px;line-height:1.1}
.logo-sub{font-size:9.5px;color:var(--mut);letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.iconbtn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);color:var(--mut);flex:none}
.iconbtn.big{width:52px;height:54px;border-radius:18px}
.livebar{display:flex;align-items:center;justify-content:center;gap:8px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:0 0 8px;text-align:center}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.live-dot.on{background:var(--grn);box-shadow:0 0 10px var(--grn)}
.live-dot.warn{background:var(--acc);box-shadow:0 0 10px var(--acc)}
.sticky{position:sticky;top:0;z-index:40;background:var(--bg);padding:6px 0 10px;border-bottom:1px solid var(--line)}
.searchrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:stretch}
.searchbox{min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;height:54px;padding:0 10px 0 18px}
.searchbox:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px var(--glow1)}
.searchbox .s-ic{color:var(--mut);flex:none}
.searchbox input{flex:1;background:transparent;border:none;outline:none;font-size:16px;font-weight:600;height:100%;min-width:0;width:100%;border-radius:999px;color:var(--ink);caret-color:var(--acc);-webkit-text-fill-color:var(--ink)}
.searchbox input::placeholder{color:var(--dim);font-weight:600}
.clearbtn{color:var(--dim);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.controls{display:flex;align-items:center;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.controls::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:800;font-size:12px;white-space:nowrap;flex:none}
.pill .pill-dot{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.pill.on{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:700;font-size:10.5px;letter-spacing:.02em;white-space:nowrap;flex:none}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding-top:16px}
.hero-art{border-radius:22px;overflow:hidden;height:140px;border:1px solid var(--line);position:relative;background:var(--card2)}
.hero-art img{width:100%;height:100%;object-fit:cover}
.hero-art .cap{position:absolute;inset:auto 0 0 0;padding:26px 14px 12px;background:linear-gradient(transparent,rgba(5,10,8,.85));color:#fff;font-family:var(--disp);font-weight:700;font-size:14px}
.hero-badge{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--grn);border:1px solid color-mix(in srgb,var(--grn) 40%,transparent);padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--grn) 8%,transparent);margin-top:14px}
.hero h1{font-family:var(--disp);font-size:clamp(26px,7vw,42px);line-height:1.08;margin:12px 0 10px;font-weight:700}
.hero p{color:var(--mut);max-width:56ch;font-size:14.5px}
.sec{margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec h2{font-family:var(--disp);font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
.sec h2 .ic{color:var(--acc)}
.sec .link{font-size:12.5px;font-weight:800;color:var(--acc);flex:none}
.wotd{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;cursor:pointer}
.wotd .thumb,.res .thumb{width:70px;height:70px;border-radius:16px;overflow:hidden;flex:none;background:var(--card2);display:flex;align-items:center;justify-content:center}
.wotd img,.res img{width:100%;height:100%;object-fit:cover}
.mono{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:28px;color:#fff;background:linear-gradient(135deg,var(--acc),#b3491a 55%,var(--grn))}
.wotd-body{flex:1;min-width:0}
.wotd-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wotd h3{font-family:var(--disp);font-size:20px;font-weight:700}
.wotd p{color:var(--mut);font-size:13px;margin-top:2px}
.badge{font-size:10px;font-weight:800;letter-spacing:.1em;padding:3px 8px;border-radius:6px;flex:none}
.badge.new{background:var(--card2);color:var(--grn);border:1px solid var(--line)}
.badge.old{background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.badge.fz{background:var(--card2);color:var(--acc);border:1px solid var(--line)}
.badge.cat{background:var(--card2);color:#60a5fa;border:1px solid var(--line)}
.badge.cw{background:var(--card2);color:#60a5fa;border:1px solid var(--line)}
.langdot{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--mut)}
.langdot i{width:8px;height:8px;border-radius:50%}
.cats,.recs{display:flex;gap:8px;flex-wrap:wrap}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:640px){.catgrid{grid-template-columns:1fr 1fr 1fr}}
.catcard{position:relative;border-radius:20px;overflow:hidden;height:130px;border:1px solid var(--line);background:var(--card2);cursor:pointer}
.catcard img{width:100%;height:100%;object-fit:cover;transition:.4s}
.catcard:active img{transform:scale(1.06)}
.catcard .ov{position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(5,10,8,.88))}
.catcard .nm{position:absolute;left:12px;right:12px;bottom:10px;color:#fff;font-family:var(--disp);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.catcard .nm span{font-size:10px;font-weight:800;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.25);padding:3px 8px;border-radius:999px}
.az{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;max-width:100%}
.az::-webkit-scrollbar{display:none}
.az button{min-width:38px;height:40px;border-radius:12px;font-weight:800;font-size:13px;color:var(--dim);background:var(--card);border:1px solid var(--line)}
.az button.has{color:var(--acc)}
.feed{display:flex;flex-direction:column;gap:10px}
.res{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;cursor:pointer;align-items:center;min-width:0}
.res .thumb{width:62px;height:62px}
.res-body{flex:1;min-width:0}
.res-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.res-top h3{font-family:var(--disp);font-size:17px;font-weight:700;overflow-wrap:anywhere}
.res-sub{color:var(--mut);font-size:12.5px;font-weight:700;margin-top:1px}
.res-snip{color:var(--mut);font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.res-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:var(--dim);font-weight:700}
.res-meta .ic{width:13px;height:13px}
.racts{display:flex;gap:6px;flex:none}
.heart{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:var(--dim);flex:none}
.heart.on{color:var(--acc)}
table.tt{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;font-size:13.5px}
table.tt th,table.tt td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
table.tt th{background:var(--card2);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
table.tt tr:last-child td{border-bottom:none}
table.tt td b{font-weight:800}
table.tt td.na{color:var(--dim);font-style:italic}
.mdtable-outer{position:relative;margin:12px 0}
.mdtable-outer .mdtable-wrap{margin:0}
.mdtable-outer.has-more::after{content:'';position:absolute;top:1px;right:1px;bottom:1px;width:30px;border-radius:0 13px 13px 0;background:linear-gradient(to right,transparent,var(--card) 78%);pointer-events:none}
.mdtable-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.mdtable-wrap table{width:100%;border-collapse:collapse;font-size:13.5px}
.mdtable-wrap th,.mdtable-wrap td{padding:9px 13px;border-bottom:1px solid var(--line);white-space:nowrap}
.mdtable-wrap th{background:var(--card2);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:800}
.mdtable-wrap tr:last-child td{border-bottom:none}
.mdtable-wrap td b{font-weight:800;color:var(--ink)}
.empty{text-align:center;padding:40px 14px;color:var(--mut)}
.empty .ic{width:44px;height:44px;color:var(--dim);margin-bottom:12px}
.empty h3{font-family:var(--disp);color:var(--ink);font-size:18px;margin-bottom:6px}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);margin:0 auto 12px;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:14px;padding:12px 20px;border-radius:14px;border:none}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.grn{background:var(--grn);color:var(--grn-ink)}
.btn.sm{padding:10px 16px;font-size:13px;border-radius:12px}
.btn.pill-compact{padding:7px 14px 7px 12px;font-size:12.5px;border-radius:999px;gap:6px}
.btn.danger{background:var(--card);color:var(--red);border:1.5px solid var(--line)}
.entrybar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.entrybar .grp{display:flex;gap:8px}
.media{border-radius:22px;overflow:hidden;height:220px;background:var(--card2);border:1px solid var(--line);position:relative}
.media img{width:100%;height:100%;object-fit:cover}
.media .mono{font-size:64px}
.media .cap{position:absolute;bottom:10px;left:12px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.55);color:#fff;padding:5px 10px;border-radius:8px}
.ehead{margin:16px 2px 4px}
.ehead h1{font-family:var(--disp);font-size:clamp(28px,8vw,40px);font-weight:700;line-height:1.05;overflow-wrap:anywhere}
.ehead .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.pron{display:flex;align-items:center;gap:8px;color:var(--mut);font-weight:800;font-size:14px;margin:8px 2px 0;letter-spacing:.06em}
.pron .ic{color:var(--acc)}
.eeng{font-size:15px;color:var(--mut);font-weight:700;margin:6px 2px 0}
.eeng b{color:var(--grn)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:12px}
.panel h4{font-family:var(--disp);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.panel h4 .ic{color:var(--acc)}
.panel p{font-size:15px;overflow-wrap:anywhere}
.ex{border-left:3px solid var(--acc);padding:8px 12px;border-radius:0 10px 10px 0;background:var(--card2);margin-top:8px}
.ex i{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.ex .lg{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.trow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed var(--line)}
.trow:last-child{border-bottom:none}
.trow .nm{width:86px;flex:none;font-size:12px;font-weight:800;color:var(--mut);display:flex;align-items:center;gap:7px}
.trow .nm i{width:9px;height:9px;border-radius:50%}
.trow .val{flex:1;font-weight:800;font-size:15px;overflow-wrap:anywhere;min-width:0}
.trow .val.na{color:var(--dim);font-weight:600;font-style:italic}
.trow .cp{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--dim);flex:none}
.rel{display:flex;gap:8px;flex-wrap:wrap}
.totop{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:80;width:50px;height:50px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(0,0,0,.4);opacity:0;pointer-events:none;transform:translateY(14px);transition:.25s}
.totop.show{opacity:1;pointer-events:auto;transform:none}
.totop:active{transform:scale(.92)}
.aiscreen{--card:#121a16;--card2:#17221c;--line:#22302a;--ink:#eaf3ed;--mut:#8fa79a;--dim:#64796e;position:fixed;left:0;right:0;top:var(--app-vtop,0px);height:var(--app-vh,100vh);background:#0b0d10;color:#eaf3ed;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(14px + env(safe-area-inset-top)) 16px 100px;z-index:55}
.aihead{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.aihead .t{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:700;font-size:19px;flex:1;min-width:0}
.aihead .t .ic{color:var(--acc)}
.aihead .sub{display:block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.aihead .iconbtn{background:var(--card);border-color:var(--line);color:var(--mut)}
.aistart{padding:26px 4px 10px}
.aistart .big{font-family:var(--disp);font-size:26px;font-weight:700;color:var(--ink)}
.aistart p{color:var(--mut);font-size:14px;margin:8px 0 16px}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.aidoc{font-size:15.5px;line-height:1.8;color:var(--ink);margin:0 0 4px}
.aidoc p{margin:9px 0;color:var(--ink)}
.aidoc b{color:var(--ink);font-weight:800;font-size:1.07em}
.aidoc h2{font-family:var(--disp);font-size:23px;color:var(--ink);margin:16px 0 8px;font-weight:700}
.aidoc h3{font-family:var(--disp);font-size:18.5px;color:var(--ink);margin:14px 0 6px;font-weight:700}
.aidoc h4{font-size:15.5px;color:var(--ink);margin:12px 0 4px;font-weight:800}
.aidoc ul{margin:8px 0 10px 20px}
.aidoc li{margin:5px 0}
.aidoc .src-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.src-chip{font-size:12px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--mut);cursor:pointer;display:inline-block}
.src-chip b{color:var(--ink)}
.docacts{display:flex;gap:0;margin:4px 0 6px -10px}
.mediaacts{display:flex;justify-content:center;gap:6px;margin:4px 0 2px}
.mediaacts .docbtn .ic{width:15px;height:15px}
.beta-tag{font-size:9.5px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc);flex:none}
.beta-note{display:flex;align-items:center;gap:8px;font-size:12px;line-height:1.4;color:var(--mut);padding:8px 10px;border:1px dashed var(--line);border-radius:12px;margin-bottom:10px}
.src-summary{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 8px 7px 7px;margin:0 0 26px;color:var(--mut);font-size:12.5px;font-weight:700}
.src-stack{display:flex;align-items:center}
.src-ic{width:20px;height:20px;border-radius:50%;background:var(--card2);border:2px solid var(--bg2);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-left:-8px;flex:none;color:var(--dim)}
.src-ic:first-child{margin-left:0}
.src-ic img{width:100%;height:100%;object-fit:cover}
.src-ic-dict{background:color-mix(in srgb,var(--acc) 25%,var(--card2))}
.src-label{color:var(--ink)}
.src-count{background:var(--card2);border-radius:999px;padding:1px 7px;font-size:11px;color:var(--dim)}
.src-summary .ic{color:var(--dim);width:13px;height:13px}
.src-group-label{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
.src-row-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line);color:var(--ink)}
.src-row-item:last-child{border-bottom:none}
.src-row-item img{width:22px;height:22px;border-radius:6px;flex:none}
.src-row-item span{flex:1;min-width:0;font-size:13.5px;line-height:1.4}
.src-row-item span small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
.src-row-item .ic{flex:none;color:var(--dim)}
.mdhr{border:none;border-top:1px solid var(--line);margin:18px 0}
.docbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:36px;border-radius:10px;border:none;background:transparent;color:var(--dim)}
.docbtn .ic{width:16px;height:16px}
.docbtn:active{color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.uq{display:flex;justify-content:flex-end;margin:18px 0 14px}
.uq .bub{background:#25483a;color:#eaf3ed;border-radius:22px 22px 6px 22px;padding:12px 18px;font-size:15px;font-weight:600;max-width:85%;white-space:pre-wrap}
.uq:first-child{margin-top:0}
.think{display:inline-flex;align-items:center;justify-content:center;width:44px;height:28px;background:var(--card2);border:1px solid var(--line);border-radius:14px;margin:2px 0}
.think .tdot{width:7px;height:7px;border-radius:50%;background:var(--mut);display:inline-block;animation:tp2 1.1s ease-in-out infinite}

function askAI(q){
 if(!state.sessionId){state.sessionId=Date.now()+'_'+Math.random().toString(36).slice(2,7);state.sessionTitle=sessionTitle(q)}
 state.chat.push({role:'user',text:q});state.typing=true;state.chatDraft='';state.forceBottom=true;state.view='chat';renderMain();
 if(!isOnlineNow()){state.typing=false;state.chat.push({role:'ai',html:'<p><b>No Internet Connection</b></p><p>'+AI_NAME+' needs an internet connection to think and answer. The offline dictionary still works with zero data \u2014 use the search bar.</p>',raw:'',sources:[],webSources:[],engine:'none',model:''});saveSession();renderMain();return}
 var found=searchList(q).slice(0,4);
 var relevant=found.length&&found[0].score>=60;
 var ctx=relevant?found.map(function(f){var it=f.item;return{head:it.head,english:it.english,translations:it.trans,meaning:it.mean,pronunciation:it.pron||null}}):[];
 if(state.thinkMode)showThinkDrawer();
 var finish=function(html,raw,engine,model,webSources){state.typing=false;state.aiAbort=null;hideThinkDrawer();state.chat.push({role:'ai',html:html,raw:raw,sources:relevant?found.map(function(f){return f.item.id}):[],webSources:webSources||[],engine:engine,model:model||''});state.forceBottom=true;saveSession();renderMain()};
 var runner=state.deepSearch?groqAskDeep:groqAsk;
 runner(q,ctx,aiKey(),ctrlSignal()).then(function(res){finish(mdDoc(res.text),res.text,'groq',res.model,res.webSources)}).catch(function(err){
  hideThinkDrawer();
  if(err.name==='AbortError'){state.typing=false;state.aiAbort=null;renderMain();toast('Stopped','info');return}
  if(String(err.message)==='AUTH'){finish('<p><b>Invalid API Key</b></p><p>The AI key could not be authenticated. Open Settings \u2192 AI Assistant to fix it.</p>','','error','');return}
  if(relevant){var lh=localDictAnswer(q,found);finish(lh,lh.replace(/<[^>]+>/g,' '),'local','');return}
  finish('<p><b>'+AI_NAME+' could not reach the AI service.</b></p><p>Check your connection and try again \u2014 dictionary search still works.</p>','','error','')});
}

function ensureTesseract(){
 if(window.Tesseract)return Promise.resolve();
 return new Promise(function(res,rej){
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
  s.onload=function(){res()};s.onerror=function(){rej(new Error('load-fail'))};
  document.head.appendChild(s);
 });
}
function runOCR(file){
 var out=$('#camResult');if(!out)return;
 if(!file){return}
 if(!isOnlineNow()){out.innerHTML='<div class="camresult"><p class="dim">Scan &amp; Translate needs internet the first time, to load the text-reading engine.</p></div>';return}
 out.innerHTML='<div class="camresult"><div class="ocrtext" id="ocrStatus">Loading text-recognition engine\u2026</div></div>';
 ensureTesseract().then(function(){
  var reader=new FileReader();
  reader.onload=function(){
   var dataUrl=reader.result;
   var st=$('#ocrStatus');if(st)st.textContent='Reading text from the image\u2026';
   Tesseract.recognize(dataUrl,'eng',{logger:function(m){if(m&&m.status==='recognizing text'){var st2=$('#ocrStatus');if(st2)st2.textContent='Reading text\u2026 '+Math.round((m.progress||0)*100)+'%'}}}).then(function(res){
    renderOCRResult(((res&&res.data&&res.data.text)||'').trim());
   }).catch(function(){out.innerHTML='<div class="camresult"><p class="dim">Could not read text from that image. Try a clearer, well-lit photo.</p></div>'});
  };
  reader.onerror=function(){out.innerHTML='<div class="camresult"><p class="dim">Could not open that image.</p></div>'};
  reader.readAsDataURL(file);
 }).catch(function(){out.innerHTML='<div class="camresult"><p class="dim">Could not load the text-recognition engine. Check your internet connection and try again.</p></div>'});
}
function renderOCRResult(text){
 var out=$('#camResult');if(!out)return;
 if(!text){out.innerHTML='<div class="camresult"><p class="dim">No text detected in that image \u2014 try a clearer photo.</p></div>';return}
 var words=norm(text).split(/[^a-z']+/).filter(function(w){return w.length>1&&!STOP.has(w)});
 var uniq=[];words.forEach(function(w){if(uniq.indexOf(w)<0)uniq.push(w)});
 var matches=[];uniq.slice(0,14).forEach(function(w){var r=searchList(w);if(r.length&&r[0].score>=90&&matches.indexOf(r[0].item)<0)matches.push(r[0].item)});
 var h='<div class="camresult"><div class="ocrtext">\u201C'+esc(text.slice(0,300))+'\u201D</div>';
 if(matches.length)h+='<div class="feed">'+matches.map(cardHTML).join('')+'</div>';
 else h+='<p class="dim" style="font-size:13px">None of the detected words are in ZamDict yet.</p>';
 out.innerHTML=h;bindImg();
}
